name: python_quizz_flash
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.10.0

dependencies:
  audioplayers: ^6.6.0
  cloud_firestore: ^6.1.3
  crypto: ^3.0.3
  firebase_app_check: ^0.4.0+1
  firebase_auth: ^6.2.0
  firebase_core: ^4.5.0
  flutter:
    sdk: flutter
  flutter_dotenv: ^6.0.0
  flutter_riverpod: ^3.1.0
  flutter_secure_storage: ^9.0.0
  font_awesome_flutter: ^10.7.0
  freezed_annotation: ^3.1.0
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  http: ^1.2.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  logger: ^2.0.0+1
  lucide_icons_flutter: ^3.1.10
  riverpod_annotation: ^4.0.0
  shared_preferences: ^2.5.4
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  build_runner: ^2.1.1
  custom_lint: ^0.8.1
  riverpod_lint: ^3.1.0
  freezed: ^3.2.3
  json_serializable: ^6.11.2

flutter:
  uses-material-design: true
  assets:
    # NOTA: .env eliminado por seguridad - usar dart-define en build
    # - .env  # NO incluir en producción (ver SECURITY.md)
    - assets/data/
    - assets/images/
    - assets/fonts/
    - assets/audio/music/

  fonts:
    - family: PressStart2P
      fonts:
        - asset: assets/fonts/PressStart2P-Regular.ttf
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
        - asset: assets/fonts/FiraCode-Bold.ttf
          weight: 700
        - asset: assets/fonts/FiraCode-Light.ttf
          weight: 300
        - asset: assets/fonts/FiraCode-Medium.ttf
          weight: 500
    - family: IBMPlexMono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Bold.ttf
          weight: 700
        - asset: assets/fonts/IBMPlexMono-Italic.ttf
          style: italic
    - family: PixelifySans
      fonts:
        - asset: assets/fonts/PixelifySans-Regular.ttf
        - asset: assets/fonts/PixelifySans-Bold.ttf
          weight: 700
